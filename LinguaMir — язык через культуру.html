button.g{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit;margin:4px 0 10px}
.lc{display:flex;gap:12px;align-items:center;cursor:pointer;border-left:6px solid var(--c)}
.em{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs button{white-space:nowrap}
.op{display:block;width:100%;text-align:left;background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px;margin:6px 0;font:inherit;cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);font:700 12px Nunito;padding:6px 2px;cursor:pointer}nav button.on{color:var(--ac)}nav b{display:block;font-size:20px}
.ok{color:var(--ok)}.bad{color:var(--bd)}

#toast.s{opacity:1}img.pv{max-width:100%;border-radius:12px;margin:8px 0}
label{font-weight:700;font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
